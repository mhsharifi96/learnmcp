[project]
name = "learnmcp"
version = "0.1.0"
description = "MCP server + Django panel connecting instructors to their students' AI assistants"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "mcp>=2.3,<3",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning", "ignore:No directory at:UserWarning"]
