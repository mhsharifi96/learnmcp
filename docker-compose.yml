name: learnmcp

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learnmcp}
      POSTGRES_USER: ${POSTGRES_USER:-learnmcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    image: learnmcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-learnmcp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-learnmcp}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
    depends_on:
      db:
        condition: service_healthy

  # Sends inactivity reminder emails (instructors set "remind after N days" per class). Checks hourly.
  reminders:
    image: learnmcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-learnmcp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-learnmcp}
      RUN_MIGRATIONS: "false"
    command: ["python", "manage.py", "send_reminders", "--loop", "${REMINDER_CHECK_SECONDS:-3600}"]
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: learnmcp-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped

  # Routes /api, /admin, /s/ (MCP), OAuth and /static to Django and everything else to Next.js.
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      # Bound to localhost by default; Caddy (profile "https") or the host nginx is the public entry point.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8000}:8000"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway

volumes:
  pgdata:
  caddy_data:
  caddy_config:
