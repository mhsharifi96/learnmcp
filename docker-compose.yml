name: learnmcp

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learnmcp}
      POSTGRES_USER: ${POSTGRES_USER:-learnmcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    image: learnmcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-learnmcp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-learnmcp}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to localhost by default; Caddy (profile "https") is the public entry point.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8000}:8000"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
