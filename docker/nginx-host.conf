# Host nginx site for learnmcp behind Cloudflare (generated by ./deploy.sh nginx-conf).
#
# Cloudflare terminates HTTPS and talks to this server over plain HTTP, so the
# origin listens on port 80 only and must NOT redirect to https (that loops).
# The original scheme comes from Cloudflare's X-Forwarded-Proto header.
#
# Install:
#   sudo cp this-file /etc/nginx/sites-available/__DOMAIN__
#   sudo ln -sf /etc/nginx/sites-available/__DOMAIN__ /etc/nginx/sites-enabled/__DOMAIN__
#   sudo nginx -t && sudo systemctl reload nginx

# Keep Cloudflare's scheme (https) when present; fall back to the local one.
map $http_x_forwarded_proto $learnmcp_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 10M;

    # MCP endpoint: no buffering so Streamable HTTP responses flow immediately.
    location /s/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $learnmcp_forwarded_proto;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $learnmcp_forwarded_proto;
        proxy_read_timeout 60s;
    }
}
