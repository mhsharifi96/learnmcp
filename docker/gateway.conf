# Single entry point inside compose: Django for the API, admin, MCP and OAuth; Next.js for pages.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream django { server web:8000; keepalive 16; }
upstream nextjs { server frontend:3000; keepalive 16; }

server {
    listen 8000;
    client_max_body_size 10M;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Connection        "";

    # MCP endpoint: stream without buffering.
    location /s/ {
        proxy_pass http://django;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/(api|admin|static|healthz|r|\.well-known|register|authorize|token)(/|$) {
        proxy_pass http://django;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://nextjs;
        proxy_read_timeout 60s;
    }
}
